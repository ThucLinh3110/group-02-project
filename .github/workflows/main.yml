name: Tests

on:
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpdesk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d helpdesk_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv sync --dev
      - run: uv run python seed_users.py
      - run: uv run uvicorn src.backend.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
      - run: for i in {1..30}; do curl --fail http://127.0.0.1:8000/ && break || sleep 1; done
      - run: uv run pytest -v tests/test_tickets.py

  frontend:
    name: Frontend Playwright tests
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e